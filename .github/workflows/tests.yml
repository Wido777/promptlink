name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests and web parity (Python vs browser engine)
        run: python -m unittest discover -s tests -v
      - name: Held-out evaluation
        run: python eval/run_eval.py
      - name: Real-world templates
        run: python eval/run_eval.py --real
      - name: Live websites (collected after v0.2 was frozen)
        run: python eval/run_eval.py --wild
