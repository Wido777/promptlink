name: scan

# Manual research scan: reads public pages from the Tranco top-sites list and
# records (1) AI-assistant links that carry pre-filled prompts and (2) text in
# the page content that speaks to AI and gives it orders. The run summary
# holds counts only; the raw results (which name sites) stay in a short-lived
# artifact until flagged items have been checked by hand.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Number of sites to scan"
        default: "200"
      offset:
        description: "Start at this rank (0 = the top); ignored for random samples"
        default: "0"
      sample:
        description: "top = consecutive ranks from the offset; random = random draw"
        default: "random"
      random_from:
        description: "Random draw from the top N ranks (0 = the whole top million)"
        default: "0"
      seed:
        description: "Random seed (same seed = same sites)"
        default: "1"
      ai_model:
        description: "Ollama model for the AI review after the scan (empty = no AI review)"
        default: ""
      ai_minutes:
        description: "Time budget for the AI review, in minutes"
        default: "150"
      pages_per_site:
        description: "Article pages to read per site, besides the homepage"
        default: "2"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the Tranco top-sites list
        run: |
          curl -fsSL -o tranco.zip "https://tranco-list.eu/top-1m.csv.zip"
          unzip -o tranco.zip
          head -3 top-1m.csv
      - name: Scan
        run: >
          python research/scan.py --tranco top-1m.csv
          --sites "${{ inputs.sites }}" --offset "${{ inputs.offset }}"
          --pages-per-site "${{ inputs.pages_per_site }}"
          ${{ inputs.sample == 'random' && format('--random --random-from {0} --seed {1}', inputs.random_from, inputs.seed) || '' }}
          --out results.jsonl
      - name: AI review
        if: inputs.ai_model != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &) ; sleep 5
          for i in $(seq 30); do curl -s localhost:11434/api/version && break; sleep 2; done
          ollama pull "${{ inputs.ai_model }}"
          python research/ai_review.py results.jsonl --provider ollama --model "${{ inputs.ai_model }}" \
            --out ai_review.jsonl --max-minutes "${{ inputs.ai_minutes }}"
      - name: Summarise
        run: |
          AI=""; [ -f ai_review.jsonl ] && AI="--ai ai_review.jsonl"
          python research/summarize.py results.jsonl $AI | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish summary as annotations (readable through the API)
        run: |
          python - <<'EOF'
          text = open("summary.md", encoding="utf-8").read()
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][:9]
          for n, chunk in enumerate(chunks, 1):
              esc = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=scan summary part {n}/{len(chunks)}::{esc}")
          EOF
      - name: Anonymised review list as annotations
        env:
          ANNOTATION_TITLE: review part
        run: |
          AI=""; [ -f ai_review.jsonl ] && AI="--ai ai_review.jsonl"
          python research/review.py results.jsonl $AI > review.md
          python research/annotate.py review.md 0 10
      - name: Anonymised review list (more)
        env:
          ANNOTATION_TITLE: review part
        run: |
          python research/annotate.py review.md 10 10
      - name: Anonymised review list (rest)
        env:
          ANNOTATION_TITLE: review part
        run: python research/annotate.py review.md 20 10
      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ inputs.sample }}-${{ inputs.sites }}-seed${{ inputs.seed }}-from${{ inputs.offset }}
          path: |
            results.jsonl
            summary.md
            ai_review.jsonl
          retention-days: 7
